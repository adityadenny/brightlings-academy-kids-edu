name: Link & Asset Health Check

on:
  schedule:
    # 16:07 UTC = ~23:07 WIB/Bangkok/Hanoi — runs after the content & sitemap jobs
    - cron: '7 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Run link & asset health check
        run: node scripts/check-links.js

      - name: Commit and push if changed
        env:
          GIT_AUTHOR_NAME: ${{ secrets.DAILY_COMMIT_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.DAILY_COMMIT_EMAIL }}
        run: |
          git config user.name "${GIT_AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${GIT_AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git add reports/link-check.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily link & asset health check ($(date -u +%F))"
            git push
          fi
