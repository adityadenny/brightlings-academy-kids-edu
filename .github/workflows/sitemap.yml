name: Update Sitemap

on:
  schedule:
    # 18:37 UTC = ~01:37 WIB/Bangkok/Hanoi — runs ~30 min after the daily
    # content refresh, so lastmod reflects that day's actual content change.
    - cron: '37 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Regenerate sitemap.xml
        run: node scripts/update-sitemap.js

      - name: Commit and push if changed
        env:
          GIT_AUTHOR_NAME: ${{ secrets.DAILY_COMMIT_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.DAILY_COMMIT_EMAIL }}
        run: |
          git config user.name "${GIT_AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${GIT_AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update sitemap lastmod ($(date -u +%F))"
            git push
          fi
