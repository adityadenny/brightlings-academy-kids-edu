name: Update Daily Content

on:
  schedule:
    # 18:07 UTC = ~01:07 WIB/Bangkok/Hanoi (UTC+7) — deep-night run.
    # Offset a few minutes past the hour on purpose: GitHub's scheduler is
    # busiest right at :00/:30 and can queue jobs for several minutes there,
    # so an odd minute keeps the actual run time closer to 01:00 WIB.
    - cron: '7 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-daily-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Regenerate quote of the day + featured testimonial
        run: node scripts/update-daily-content.js

      - name: Commit and push if content changed
        env:
          GIT_AUTHOR_NAME: ${{ secrets.DAILY_COMMIT_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.DAILY_COMMIT_EMAIL }}
        run: |
          git config user.name "${GIT_AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${GIT_AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git add assets/js/daily-content.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh quote of the day ($(date -u +%F))"
            git push
          fi
